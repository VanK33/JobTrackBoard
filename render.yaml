services:
  - type: web
    name: job-tracker-platform
    env: node
    plan: free
    buildCommand: npm install && npm run build:prod
    startCommand: npm start
    runtime: node
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: job-tracker-db
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: job-tracker-db
    plan: free